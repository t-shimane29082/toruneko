<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>トルネコ３ 異世界チェックリスト（案4 縦並び 音声入力）</title>
<style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 10px 16px 40px;
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
        font-size: 12px;
        line-height: 1.5;
        color: #212529;
        background: #fff;
    }

    input, button, select, textarea { font: inherit; }
    button, input[type=button], select, label { cursor: pointer; }

    h3, h5 { font-size: 12px; font-weight: bold; margin: 0 0 4px; }

    /* 上部バー */
    .toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-bottom: 8px;
        border-bottom: 2px solid #343a40;
    }
    .toolbar h3 { margin: 0; }
    .toolbar .legend { margin-left: auto; color: #495057; }
    .toolbar .legend b { color: #1971c2; font-weight: normal; }

    /* 固定幅をやめ、画面が狭いときは折り返す */
    .contents {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 24px;
        margin-top: 12px;
    }

    /* アイテム表 */
    .table { display: table; border-collapse: collapse; }
    .table_row { display: table-row; }
    .table_cell {
        display: table-cell;
        padding: 1.5px 8px;
        border-bottom: 1px solid #ccc;
        vertical-align: middle;
        white-space: nowrap;
    }
    .table_cell.name, .table_cell.note { text-align: left; }
    .table_cell.sale { text-align: right; }

    /* スクロールしても見出しが残るように固定 */
    .table_head .table_cell {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #343a40;
        color: #fff;
        font-weight: bold;
        text-align: center;
    }

    /* 値段識別：マウスを乗せた行と同じ売値の行を強調 */
    .table_row.same_sale .table_cell { background: #fff3bf; }
    .table_row:not(.table_head):hover .table_cell { background: #ffd43b; }

    /* 同じ売値で未チェックの候補数 */
    .rest { margin-left: 4px; font-size: 10px; color: #1971c2; }
    .rest.zero { color: #adb5bd; }

    /* チェック済みの行はグレー＋取り消し線 */
    .table_row:has(input:checked) .table_cell {
        color: #adb5bd;
        text-decoration: line-through;
    }

    /* 左：アイテム表 / 右：常に見える固定パネル */
    .layout { display: flex; align-items: flex-start; gap: 14px; margin-top: 12px; }
    .layout .contents { flex: 1; margin-top: 0; gap: 14px; min-width: 0; }
    .contents.cats { display: block; }
    .layout .table_cell { padding: 1.5px 5px; }
    .side {
        position: sticky;
        top: 0;
        flex: none;
        width: auto;
        max-height: 100vh;
        overflow-y: auto;
        padding: 0 4px 12px 12px;
        border-left: 2px solid #dee2e6;
    }

    /* 指輪識別グリッド（行：あ〜こ、列：効果） */
    .ring_grid { border-collapse: collapse; }
    .ring_grid th, .ring_grid td { border: 1px solid #ced4da; text-align: center; padding: 0; }
    .ring_grid thead th {
        background: #343a40;
        color: #fff;
        font-weight: normal;
        font-size: 11px;
        line-height: 1.2;
        padding: 3px 2px;
        vertical-align: bottom;
    }
    .ring_grid tbody th { background: #f1f3f5; padding: 0 6px; }
    .ring_grid td label { display: block; padding: 3px 6px; }
    .ring_grid td:hover { background: #e7f1ff; }
    .ring_grid td:has(input:checked) { background: #a5d8ff; }
    .ring_grid tbody tr:hover th { background: #ffd43b; }

    /* カテゴリを縦に積み、アイテムはタイルにして横に並べる（端で折り返す） */
    .cat + .cat { margin-top: 12px; }
    .cat_title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 0 0 4px;
        padding: 2px 8px;
        background: #343a40;
        color: #fff;
        font-size: 12px;
    }
    .table.tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        /* 左上から下へ並べ、下まで行ったら右の列の上へ折り返す（行数はJSで設定） */
        grid-auto-flow: column;
        border-left: 1px solid #dee2e6;
    }
    .table_row.tile {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 6px;
        border-right: 1px solid #dee2e6;
        border-bottom: 1px solid #dee2e6;
        white-space: nowrap;
        min-width: 0;
    }
    .tile input { margin: 0 2px 0 0; flex: none; }
    .tile .name { flex: none; }
    .tile .note { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 11px; color: #868e96; }
    /* 残数と売値は固定幅＋等幅数字にして、桁数が違っても縦にそろえる（売値が一番右） */
    .tile .rest,
    .tile .sale { flex: none; text-align: right; font-variant-numeric: tabular-nums; }
    .tile .rest { width: 4.6em; margin-left: auto; font-size: 11px; color: #1971c2; }
    .tile .rest.zero { color: #adb5bd; }
    .tile .sale { width: 3.4em; font-weight: bold; font-size: 12px; }
    .table_row.tile.same_sale { background: #fff3bf; }
    .table_row.tile:hover { background: #ffd43b; }
    .table_row.tile:has(input:checked) .name,
    .table_row.tile:has(input:checked) .sale,
    .table_row.tile:has(input:checked) .note { color: #adb5bd; text-decoration: line-through; }

    /* 絞り込み */
    .search { display: flex; align-items: center; gap: 6px; }
    #filter_text { width: 220px; padding: 1px 6px; }
    #filter_count { color: #1971c2; min-width: 5em; }
    body.filtering .tile.miss { opacity: .2; }
    /* 対象外でも、同じ売値のハイライト中とマウスを乗せたマスは見えるようにする */
    body.filtering .tile.miss.same_sale,
    body.filtering .tile.miss:hover { opacity: .8; }


    .note_box { color: #495057; }

    /* ニフラムカウンター */
    .counter { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
    .counter input { width: 70px; text-align: right; }
    .counter button { min-width: 32px; }

    #memo { width: 100%; }

    section + section { margin-top: 14px; }

    /* 音声入力：聞き取り中はボタンを赤くし、結果は画面左下に出す（レイアウトを崩さないよう固定表示） */
    #voice_btn.on { background: #e03131; border-color: #e03131; color: #fff; }
    #voice_log {
        display: none;
        position: fixed;
        left: 16px;
        bottom: 12px;
        z-index: 10;
        max-width: calc(100vw - 32px);
        padding: 6px 12px;
        border-radius: 4px;
        background: #343a40;
        color: #fff;
        font-size: 13px;
    }
    #voice_log.show { display: block; }
    #voice_log .heard { color: #ffd43b; margin-right: 10px; }
    #voice_log .ng { color: #ffa8a8; }
    /* 音声でチェックしたマスを一瞬光らせる／同名の候補は枠で示す */
    .voice_hit { animation: voice_flash 1.5s ease-out; }
    @keyframes voice_flash { from { background: #69db7c; } to { background: transparent; } }
    .voice_cand { outline: 2px solid #1971c2; outline-offset: -2px; }
</style>
</head>

        // （元はlabelの中にlabelが入っていたので、入れ子をなくした）
        function createList(table, list, prefix) {
            list.forEach(function (element, index) {
                var id = prefix + '_' + index;
                var tr = document.createElement("label");
                tr.className = "table_row tile";
                tr.dataset.sale = element.sale;
                tr.dataset.search = normalizeText(element.name + " " + element.sale + " " + element.description);
                tr.dataset.nums = (element.description.match(/\d+/g) || []).join(",");
                tr.dataset.tip = element.name + "　売値" + element.sale + (element.description ? "　" + element.description : "");
                tr.title = tr.dataset.tip;
                tr.innerHTML =
                    '<input type="checkbox" id="' + id + '">' +
                    '<span class="name">' + element.name + '</span>' +
                    '<span class="note">' + element.description + '</span>' +
                    '<span class="rest"></span>' +
                    '<span class="sale">' + element.sale + '</span>';
                table.appendChild(tr);
            });
            addSameSaleHighlight(table);
        }

        // マウスを乗せた行と同じ売値の行を強調する（クリック不要）
        function addSameSaleHighlight(table) {
            if (table.dataset.highlight) return;
            table.dataset.highlight = "1";
            function highlight(sale) {
                table.querySelectorAll(".table_row[data-sale]").forEach(function (row) {
                    row.classList.toggle("same_sale", sale !== null && row.dataset.sale === sale);
                });
            }
            table.addEventListener("mouseover", function (e) {
                var row = e.target.closest(".table_row[data-sale]");
                highlight(row ? row.dataset.sale : null);
            });
            table.addEventListener("mouseleave", function () { highlight(null); });
        }

        // 売値の横に「同じ売値で未チェックの数/同じ売値の総数」を表示する
        function refreshView() {
            document.querySelectorAll(".table").forEach(function (table) {
                var rows = table.querySelectorAll(".table_row[data-sale]");
                var total = {}, rest = {};
                rows.forEach(function (row) {
                    var sale = row.dataset.sale;
                    total[sale] = (total[sale] || 0) + 1;
                    if (!row.querySelector("input").checked) rest[sale] = (rest[sale] || 0) + 1;
                });
                rows.forEach(function (row) {
                    var sale = row.dataset.sale;
                    var badge = row.querySelector(".rest");
                    var n = rest[sale] || 0;
                    badge.textContent = total[sale] > 1 ? "残" + n + "/" + total[sale] : "";
                    badge.classList.toggle("zero", n === 0);
                    if (row.dataset.tip) {
                        row.title = row.dataset.tip + (total[sale] > 1 ? "　／　同じ売値で未チェック " + n + "/" + total[sale] : "　／　同じ売値のアイテムはほかにない");
                    }
                });
            });
        }

                    } else {
                        hit = row.dataset.search.indexOf(q) >= 0;
                    }
                }
                row.classList.toggle("miss", q !== "" && !hit);
                if (q !== "" && hit) count++;
            });

        //音声用の照合キー：表記ゆれに加えて空白・記号と「の」を消す（「杖のメダパニ」「しあわせの種」のように「の」が入るかどうかがぶれるため）
        function voiceKey(text) {

                .replace(/[\s、。，．,.!！?？・*＊～~（）()「」『』]/g, "")
                .replace(/壷/g, "壺").replace(/巻き物/g, "巻物").replace(/種/g, "たね").replace(/罠/g, "わな")

        ];

        VOICE_CATS.forEach(function (cat) {
            cat.words = cat.words.map(voiceKey);
            cat.items = [];
            cat.list.forEach(function (item, index) {
                var entry = {
                    label: cat.label + "／" + item.name.replace(/\*/g, ""),
                    keys: [item.name].concat(VOICE_READINGS[item.name] || []).map(voiceKey),
                    input: document.getElementById(cat.prefix + "_" + index)

        //完全一致を優先し、なければ部分一致（2文字以上）で探す
        function findVoiceItems(q, items) {
            var exact = items.filter(function (it) { return it.keys.indexOf(q) >= 0; });
            if (exact.length || q.length < 2) return exact;
            return items.filter(function (it) {
                return it.keys.some(function (k) { return k.indexOf(q) >= 0 || (k.length >= 2 && q.indexOf(k) >= 0); });
            });
        }

        function resolveVoiceItem(q) {
            var exact = voiceItems.filter(function (it) { return it.keys.indexOf(q) >= 0; });
            if (exact.length) return exact;
            for (var i = 0; i < VOICE_CATS.length; i++) {
                var cat = VOICE_CATS[i];
                for (var j = 0; j < cat.words.length; j++) {

                    if (q.length > w.length && q.indexOf(w) === 0) rest = q.slice(w.length);
                    else if (q.length > w.length && q.slice(-w.length) === w) rest = q.slice(0, -w.length);

        };
        var VOICE_RING_EFFECTS = {
            1: ["通過"], 2: ["へた", "へた投げ", "下手", "下手投げ"], 3: ["まがり", "曲がり", "ふしぎ", "不思議", "不思議投げ", "遠投", "えんとう"],
            4: ["ドラゴン"], 5: ["混乱", "こんらん", "混乱よけ"], 6: ["ワナあて", "罠当て", "わな当て"], 7: ["しあわせ", "幸せ"],
            8: ["眠らず", "ねむらず"], 9: ["人形", "にんぎょう", "人形よけ"], 0: ["ザメハ"], 10: ["痛恨", "つうこん"]
        };
        function resolveVoiceRingGrid(q) {
            q = q.replace(/^(指輪|ゆびわ)/, "");
            for (var k = 0; k < ringIdKana.length; k++) {
                var kanaId = ringIdKana[k][0], spellings = VOICE_RING_KANA[kanaId];
                for (var s = 0; s < spellings.length; s++) {
                    if (q.indexOf(spellings[s]) !== 0) continue;
                    var rest = q.slice(spellings[s].length);
                    for (var eff in VOICE_RING_EFFECTS) {
                        if (VOICE_RING_EFFECTS[eff].map(voiceKey).indexOf(rest) < 0) continue;
                        var effName = ringIdEffects.filter(function (e) { return String(e[0]) === eff; })[0][1];
                        return { input: document.getElementById(kanaId + "_" + eff), label: "指輪識別 " + ringIdKana[k][1] + "：" + effName };
                    }
                }
            }
            return null;
        }

        //聞き取った文を解釈する（ここでは画面を変えず、何をするかだけ返す）
        function interpretVoice(text) {
            var q = voiceKey(text);
            if (q.indexOf("にふらむ") >= 0) {
                if (/ぷらす|たす|足す|ふやす|増やす|\+/.test(q)) return { ok: true, nifuramu: 1, msg: "ニフラムカウンター ＋1" };
                if (/まいなす|ひく|引く|へらす|減らす|-|−/.test(q)) return { ok: true, nifuramu: -1, msg: "ニフラムカウンター −1" };
            }
            //雑談やゲーム音を拾って勝手にチェックしないよう、「チェック」と言ったときだけ反応する
            var m = q.match(/^(.*?)(ちぇっく|check)/);
            if (!m) return { ok: false, msg: "「チェック」が聞き取れなかったので何もしません" };
            var target = m[1].replace(/を$/, "");
            if (!target) return { ok: false, msg: "何をチェックするか聞き取れませんでした" };

            var cell = resolveVoiceRingGrid(target);
            if (cell) return { ok: true, targets: [cell], msg: cell.label };

            var hits = resolveVoiceItem(target);
            if (hits.length === 1) return { ok: true, targets: hits, msg: hits[0].label };
            if (hits.length > 1) {
                return {
                    ok: false, cands: hits,
                    msg: "候補が複数あります：" + hits.slice(0, 6).map(function (h) { return h.label; }).join("、") + (hits.length > 6 ? " ほか" : "") +
                        "　→「杖のメダパニ」のようにカテゴリも言ってください"
                };
            }
            return { ok: false, msg: "該当するアイテムが見つかりません" };
        }

        var voiceBtn = document.getElementById("voice_btn");
        var voiceLog = document.getElementById("voice_log");
        var voiceCandTimer = null;

        function showVoiceLog(heard, msg, ng) {
            voiceLog.innerHTML = "";
            if (heard) {
                var h = document.createElement("span");
                h.className = "heard";
                h.textContent = "「" + heard + "」";
                voiceLog.appendChild(h);
            }
            var m = document.createElement("span");
            if (ng) m.className = "ng";
            m.textContent = msg;
            voiceLog.appendChild(m);
            voiceLog.classList.add("show");
        }

        function clearVoiceCands() {
            document.querySelectorAll(".voice_cand").forEach(function (el) { el.classList.remove("voice_cand"); });
        }

        //チェックしたマスを光らせ、画面外なら見える位置までスクロールする
        function flashVoiceTarget(input) {
            var box = input.closest(".tile, td");
            box.classList.remove("voice_hit");
            void box.offsetWidth; //アニメーションを最初からやり直すため
            box.classList.add("voice_hit");
            box.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }

        function runVoice(result, heard) {
            clearVoiceCands();
            if (result.nifuramu) {
                addNifuramu(result.nifuramu);
                showVoiceLog(heard, result.msg + "（現在 " + document.getElementById("nifuramu_counter").value + "）");
                return;
            }
            if (result.targets) {
                var already = result.targets[0].input.checked;
                result.targets.forEach(function (t) {
                    t.input.checked = true;
                    flashVoiceTarget(t.input);
                });
                saveCheckListData(); //プログラムからチェックしても change は発生しないので、ここで保存する
                showVoiceLog(heard, result.msg + (already ? " は既にチェック済みです" : " をチェックしました"));
                return;
            }
            if (result.cands) {
                result.cands.forEach(function (c) { c.input.closest(".tile").classList.add("voice_cand"); });
                clearTimeout(voiceCandTimer);
                voiceCandTimer = setTimeout(clearVoiceCands, 8000);
            }
            showVoiceLog(heard, result.msg, true);
        }

        var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        var recognition = null;
        var voiceOn = false;

        function setVoice(on) {
            voiceOn = on;
            voiceBtn.classList.toggle("on", on);
            voiceBtn.textContent = on ? "🎤 聞き取り中（押すと停止）" : "🎤 音声入力";
            if (on) {
                try { recognition.start(); } catch (err) { /* すでに開始済みのときは例外になるので無視 */ }
                showVoiceLog("", "話しかけてください（例：「メダパニの杖チェック」「あ 通過 チェック」「ニフラム プラス」）");
            } else {
                recognition.stop();
                voiceLog.classList.remove("show");
            }
        }

        if (!Recognition) {
            voiceBtn.disabled = true;
            voiceBtn.title = "このブラウザは音声認識に対応していません（Chrome か Edge で開いてください）";
        } else {
            recognition = new Recognition();
            recognition.lang = "ja-JP";
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 5; //第1候補で見つからなくても、第2候補以降で一致すればそちらを使う

            recognition.onresult = function (e) {
                for (var i = e.resultIndex; i < e.results.length; i++) {
                    var res = e.results[i];
                    if (!res.isFinal) {
                        showVoiceLog(res[0].transcript + "…", "");
                        continue;
                    }
                    var best = null, heard = res[0].transcript;
                    for (var j = 0; j < res.length; j++) {
                        var r = interpretVoice(res[j].transcript);
                        if (r.ok) { best = r; heard = res[j].transcript; break; }
                        if (!best || (r.cands && !best.cands)) { best = r; heard = res[j].transcript; }
                    }
                    runVoice(best, heard);
                }
            };
            recognition.onerror = function (e) {
                if (e.error === "not-allowed" || e.error === "service-not-allowed") {
                    setVoice(false);
                    showVoiceLog("", "マイクの使用が許可されていません（アドレスバー左のアイコンから許可してください）", true);
                } else if (e.error === "network") {
                    setVoice(false);
                    showVoiceLog("", "音声認識サーバーに接続できません（インターネット接続を確認してください）", true);
                }
                //no-speech（無音）や aborted は日常的に起きるので無視し、onend で再開する
            };
            //しばらく無音だとブラウザ側で認識が止まるので、ONの間は自動で再開する
            recognition.onend = function () {
                if (voiceOn) {
                    try { recognition.start(); } catch (err) { }
                }
            };
            voiceBtn.addEventListener("click", function () { setVoice(!voiceOn); });
        }

    </script>
</body>

</html>
